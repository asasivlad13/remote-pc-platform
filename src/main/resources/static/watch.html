<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Remote PC - WebRTC Watch</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { margin: 0; background: #0b1220; color: #e2e8f0; font-family: Inter, sans-serif; }
        .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); }
        .panel { display: flex; gap: 8px; align-items: center; }
        .btn { border: 1px solid #334155; background: #1e293b; color: #e2e8f0; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
        .btn:hover { background: #334155; }
        .video-wrap { position: fixed; inset: 64px 0 0; display: flex; justify-content: center; align-items: center; }
        #remoteVideo { width: min(96vw, 1800px); height: calc(100vh - 86px); object-fit: contain; background: #020617; border-radius: 12px; }
        #status { position: fixed; right: 16px; bottom: 16px; background: rgba(2,6,23,.8); border: 1px solid #334155; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
    </style>
</head>
<body>
<div class="top-bar">
    <div>
        <strong>Remote Access (WebRTC)</strong>
        <div id="pcName" style="font-size: 12px; opacity: .8">Подключение…</div>
    </div>
    <div class="panel">
        <button id="toggleControl" class="btn">🎮 Control: ON</button>
        <button id="fullscreen" class="btn">🖥️ Fullscreen</button>
        <button id="disconnect" class="btn">⏻ Exit</button>
    </div>
</div>

<div class="video-wrap">
    <video id="remoteVideo" autoplay playsinline muted></video>
</div>
<div id="status">🟡 Connecting...</div>

<script src="/libs/adapter.min.js"></script>
<script src="/webrtcstreamer.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const pcId = Number(params.get('pcId'));
    const pcName = decodeURIComponent(params.get('pcName') || 'Unknown PC');
    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = '/login.html';
    }

    document.getElementById('pcName').textContent = `${pcName} (ID: ${pcId || '-'})`;

    const statusEl = document.getElementById('status');
    const video = document.getElementById('remoteVideo');
    const controlBtn = document.getElementById('toggleControl');

    const streamHost = params.get('streamHost') || window.location.hostname;
    const streamPort = Number(params.get('streamPort') || '8000');
    const streamName = params.get('stream') || 'screen://';
    const webrtcApi = `http://${streamHost}:${streamPort}`;

    const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const wsPort = window.location.port || '8080';
    const ws = new WebSocket(`${wsProtocol}://${window.location.hostname}:${wsPort}/ws/client`);

    let controlEnabled = true;
    let remoteScreenWidth = 1920;
    let remoteScreenHeight = 1080;
    let webRtcStreamer;

    async function loadScreenSize() {
        try {
            const res = await fetch(`/pcs/${pcId}`, { headers: { Authorization: `Bearer ${token}` } });
            if (!res.ok) return;
            const pc = await res.json();
            if (pc.screenWidth && pc.screenHeight) {
                remoteScreenWidth = pc.screenWidth;
                remoteScreenHeight = pc.screenHeight;
            }
        } catch (_) {}
    }

    function sendCommand(action, data = {}) {
        if (!controlEnabled || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'command', pcId, action, ...data }));
    }

    function bindInput() {
        let lastMove = 0;

        video.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMove < 15) return;
            lastMove = now;

            const rect = video.getBoundingClientRect();
            const x = Math.round(((e.clientX - rect.left) / rect.width) * remoteScreenWidth);
            const y = Math.round(((e.clientY - rect.top) / rect.height) * remoteScreenHeight);
            sendCommand('MOUSE_MOVE', { x: Math.max(0, Math.min(x, remoteScreenWidth)), y: Math.max(0, Math.min(y, remoteScreenHeight)) });
        });

        video.addEventListener('mousedown', (e) => {
            const button = e.button === 2 ? 3 : (e.button === 1 ? 2 : 1);
            sendCommand('MOUSE_CLICK', { button });
            e.preventDefault();
        });

        video.addEventListener('wheel', (e) => {
            sendCommand('MOUSE_WHEEL', { delta: Math.sign(e.deltaY) });
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (!controlEnabled) return;
            sendCommand('KEY_PRESS', {
                keyCode: e.keyCode,
                ctrl: e.ctrlKey,
                alt: e.altKey,
                shift: e.shiftKey
            });
            if (["Tab", "Escape", "F5"].includes(e.key)) e.preventDefault();
        });
    }

    function startWebRtc() {
        if (typeof WebRtcStreamer !== 'function') {
            statusEl.textContent = '🔴 webrtcstreamer.js не загружен';
            return;
        }

        webRtcStreamer = new WebRtcStreamer(video, webrtcApi);
        webRtcStreamer.connect(streamName, null, null, null, null);
        statusEl.textContent = `🟢 WebRTC: ${webrtcApi} (${streamName})`;
    }

    ws.onopen = async () => {
        await loadScreenSize();
        ws.send(JSON.stringify({ type: 'watch', pcId }));
        bindInput();
        startWebRtc();
    };

    ws.onclose = () => {
        statusEl.textContent = '🟡 WS disconnected';
    };

    ws.onerror = () => {
        statusEl.textContent = '🔴 WS error';
    };

    controlBtn.addEventListener('click', () => {
        controlEnabled = !controlEnabled;
        controlBtn.textContent = `🎮 Control: ${controlEnabled ? 'ON' : 'OFF'}`;
    });

    document.getElementById('fullscreen').addEventListener('click', async () => {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    });

    document.getElementById('disconnect').addEventListener('click', () => {
        if (webRtcStreamer) webRtcStreamer.disconnect();
        if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'stop', pcId }));
            ws.close();
        }
        window.location.href = '/pcs.html';
    });
</script>
</body>
</html>
