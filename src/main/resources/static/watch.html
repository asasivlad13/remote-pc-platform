<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Remote PC - Remote Access</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); overflow: hidden;">
<div class="top-bar" style="position:fixed;top:0;left:0;right:0;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;z-index:100;">
    <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:40px;height:40px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:12px;display:flex;align-items:center;justify-content:center;">💻</div>
        <div><div style="font-weight:600;">Remote Access</div><div style="font-size:12px;color:#93c5fd;" id="pcNameDisplay">Connecting...</div></div>
    </div>
    <div style="display:flex;gap:10px;">
        <div style="color:#93c5fd;font-size:13px;display:none;gap:16px;" id="metrics"><span>📊 FPS: <span id="fps" style="color:#34d399;">0</span></span><span>⏱️ Latency: <span id="latency" style="color:#fbbf24;">0</span> ms</span></div>
        <button id="controlModeBtn" class="btn-glass" style="background:rgba(16,185,129,0.2);border-color:rgba(16,185,129,0.5);">🎮 Control</button>
        <button id="settingsBtn" class="btn-glass">⚙️</button>
        <button id="fullscreenBtn" class="btn-glass">🖥️</button>
        <button id="disconnectBtn" class="btn-glass" style="background:rgba(239,68,68,0.2);border-color:rgba(239,68,68,0.5);">⏻</button>
    </div>
</div>

<div id="settingsPanel" class="settings-panel" style="position:fixed;top:70px;right:20px;width:280px;padding:20px;z-index:200;display:none;">
    <h3 style="margin-bottom:16px;">⚙️ Video Settings</h3>
    <div style="margin-bottom:16px;">
        <label style="color:#93c5fd;font-size:13px;">Resolution</label>
        <select id="resolutionSelect" class="settings-select" style="width:100%;margin-top:6px;">
            <option value="360">360p (640x360)</option>
            <option value="480">480p (854x480)</option>
            <option value="720" selected>720p (1280x720)</option>
            <option value="1080">1080p (1920x1080)</option>
            <option value="1440">1440p (2560x1440)</option>
            <option value="2160">4K (3840x2160)</option>
        </select>
    </div>
    <div style="margin-bottom:20px;">
        <label style="color:#93c5fd;font-size:13px;">Frame Rate</label>
        <select id="fpsSelect" class="settings-select" style="width:100%;margin-top:6px;">
            <option value="15">15 FPS</option>
            <option value="24">24 FPS</option>
            <option value="30" selected>30 FPS</option>
            <option value="60">60 FPS</option>
        </select>
    </div>
    <button id="applySettingsBtn" class="btn-primary" style="width:100%;justify-content:center;">Apply</button>
</div>

<div style="position:fixed;top:70px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;">
    <canvas id="videoCanvas" style="max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;border-radius:16px;"></canvas>
</div>

<div id="loadingOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:50;">
    <div style="text-align:center;"><div class="loading-spinner" style="margin:0 auto;"></div><p style="margin-top:20px;">Connecting...</p></div>
</div>

<div id="statusBadge" style="position:fixed;bottom:16px;right:16px;background:rgba(0,0,0,0.6);padding:6px 14px;border-radius:20px;font-size:12px;color:#34d399;">🟢 Connected</div>

<div id="modeIndicator" style="position:fixed;bottom:16px;left:16px;background:rgba(0,0,0,0.6);padding:6px 14px;border-radius:20px;font-size:11px;">
    🎮 Control Mode Active
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const pcId = urlParams.get('pcId');
    const pcName = decodeURIComponent(urlParams.get('pcName') || 'Unknown');
    document.getElementById('pcNameDisplay').innerText = pcName;

    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');

    let ws, frameCount = 0, lastTime = Date.now(), lastFrameTime = Date.now(), lastFrameReceived = 0, currentResolution = '720', currentFps = 30, frameInterval = 1000/30;
    let controlMode = true;
    let remoteScreenWidth = 1920;
    let remoteScreenHeight = 1080;

    async function getRemoteScreenSize() {
        try {
            const response = await fetch(`/pcs/${pcId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const pc = await response.json();
            if (pc.screenWidth && pc.screenHeight) {
                remoteScreenWidth = pc.screenWidth;
                remoteScreenHeight = pc.screenHeight;
                console.log('Remote screen size:', remoteScreenWidth, 'x', remoteScreenHeight);
            }
        } catch(e) {
            console.error('Failed to get remote screen size', e);
        }
    }

    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsHost = window.location.hostname;
    const wsPort = 8080;
    const WS_URL = `${wsProtocol}//${wsHost}:${wsPort}/ws/client`;
    console.log('WebSocket URL:', WS_URL);

    function getSize(r) {
        const sizes = {
            '360': { w: 640, h: 360 },
            '480': { w: 854, h: 480 },
            '720': { w: 1280, h: 720 },
            '1080': { w: 1920, h: 1080 },
            '1440': { w: 2560, h: 1440 },
            '2160': { w: 3840, h: 2160 }
        };
        return sizes[r] || sizes['720'];
    }

    function applySettings() {
        currentResolution = document.getElementById('resolutionSelect').value;
        currentFps = parseInt(document.getElementById('fpsSelect').value);
        frameInterval = 1000 / currentFps;
        const s = getSize(currentResolution);
        canvas.width = s.w;
        canvas.height = s.h;
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'settings', pcId: parseInt(pcId), resolution: currentResolution, fps: currentFps }));
        }
    }

    function connect() {
        document.getElementById('loadingOverlay').style.display = 'flex';
        ws = new WebSocket(WS_URL);

        // Настройка для приёма бинарных данных
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
            console.log('WebSocket connected to', WS_URL);
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('metrics').style.display = 'flex';
            ws.send(JSON.stringify({ type: 'watch', pcId: parseInt(pcId) }));
            console.log('Watch sent for PC ID:', pcId);
            setTimeout(applySettings, 500);
        };

        ws.onmessage = (event) => {
            // Обработка бинарных данных (WebP/JPEG кадры)
            if (event.data instanceof ArrayBuffer) {
                const bytes = new Uint8Array(event.data);
                // Определяем тип изображения по первым байтам
                let mimeType = 'image/jpeg';
                if (bytes.length > 4 && bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46) {
                    mimeType = 'image/webp';
                }

                const blob = new Blob([bytes], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);

                    frameCount++;
                    const now = Date.now();
                    if (now - lastTime >= 1000) {
                        document.getElementById('fps').innerText = frameCount;
                        frameCount = 0;
                        lastTime = now;
                    }
                    document.getElementById('latency').innerText = now - lastFrameTime;
                    lastFrameTime = now;
                };
                img.onerror = () => {
                    console.error('Failed to decode image');
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            }
            // Обработка JSON сообщений (команды, статусы, настройки)
            else if (typeof event.data === 'string') {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'frame') {
                        // Совместимость со старым форматом (Base64)
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            frameCount++;
                            const now = Date.now();
                            if (now - lastTime >= 1000) {
                                document.getElementById('fps').innerText = frameCount;
                                frameCount = 0;
                                lastTime = now;
                            }
                            document.getElementById('latency').innerText = now - lastFrameTime;
                            lastFrameTime = now;
                        };
                        img.src = `data:image/jpeg;base64,${data.image}`;
                    }
                } catch(e) {
                    console.log('Non-JSON message:', event.data);
                }
            }
        };

        ws.onclose = () => {
            console.log('WebSocket closed');
            document.getElementById('statusBadge').innerHTML = '🟡 Reconnecting...';
            setTimeout(connect, 3000);
        };

        ws.onerror = (err) => {
            console.error('WebSocket error:', err);
            document.getElementById('statusBadge').innerHTML = '🔴 Error';
        };
    }

    let lastMouseMove = 0, lastClick = 0, lastWheel = 0;
    function sendCommand(action, data) {
        if (ws && ws.readyState === WebSocket.OPEN && controlMode) {
            ws.send(JSON.stringify({ type: 'command', pcId: parseInt(pcId), action: action, ...data }));
        }
    }

    function toggleControlMode() {
        controlMode = !controlMode;
        const btn = document.getElementById('controlModeBtn');
        const indicator = document.getElementById('modeIndicator');
        if (controlMode) {
            btn.innerHTML = '🎮 Control';
            btn.style.background = 'rgba(16,185,129,0.2)';
            btn.style.borderColor = 'rgba(16,185,129,0.5)';
            indicator.innerHTML = '🎮 Control Mode Active - Keyboard & Mouse enabled';
            indicator.style.color = '#34d399';
        } else {
            btn.innerHTML = '👁️ View';
            btn.style.background = 'rgba(245,158,11,0.2)';
            btn.style.borderColor = 'rgba(245,158,11,0.5)';
            indicator.innerHTML = '👁️ View Mode - Keyboard & Mouse disabled (use Esc to exit fullscreen)';
            indicator.style.color = '#fbbf24';
        }
    }

    // Mouse move with scaling
    canvas.addEventListener('mousemove', (e) => {
        if (!controlMode) return;
        const now = Date.now();
        if (now - lastMouseMove < 16) return;
        lastMouseMove = now;

        const rect = canvas.getBoundingClientRect();
        const canvasX = (e.clientX - rect.left) * (canvas.width / rect.width);
        const canvasY = (e.clientY - rect.top) * (canvas.height / rect.height);

        const remoteX = Math.round(canvasX / canvas.width * remoteScreenWidth);
        const remoteY = Math.round(canvasY / canvas.height * remoteScreenHeight);

        sendCommand('MOUSE_MOVE', { x: Math.max(0, Math.min(remoteX, remoteScreenWidth)), y: Math.max(0, Math.min(remoteY, remoteScreenHeight)) });
    });

    canvas.addEventListener('click', (e) => {
        if (!controlMode) return;
        const now = Date.now();
        if (now - lastClick < 200) return;
        lastClick = now;
        sendCommand('MOUSE_CLICK', { button: 1 });
    });

    canvas.addEventListener('wheel', (e) => {
        if (!controlMode) return;
        const now = Date.now();
        if (now - lastWheel < 50) return;
        lastWheel = now;
        e.preventDefault();
        const delta = e.deltaY > 0 ? -1 : 1;
        sendCommand('MOUSE_WHEEL', { delta: delta });
    });

    // Keyboard events
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.fullscreenElement) {
            document.exitFullscreen();
            e.preventDefault();
            return;
        }
        if (!controlMode) return;
        e.preventDefault();
        e.stopPropagation();

        if (e.key === 'F4' && e.altKey) return;
        if (e.key === 'Delete' && e.ctrlKey && e.altKey) return;

        let keyCode = e.keyCode;
        const specialKeys = {
            'Delete': 46, 'Insert': 45, 'Home': 36, 'End': 35,
            'PageUp': 33, 'PageDown': 34, 'ArrowUp': 38, 'ArrowDown': 40,
            'ArrowLeft': 37, 'ArrowRight': 39, 'F1': 112, 'F2': 113,
            'F3': 114, 'F4': 115, 'F5': 116, 'F6': 117, 'F7': 118,
            'F8': 119, 'F9': 120, 'F10': 121, 'F11': 122, 'F12': 123
        };
        if (specialKeys[e.key]) keyCode = specialKeys[e.key];

        const ctrl = e.ctrlKey;
        const alt = e.altKey;
        const shift = e.shiftKey;
        const meta = e.metaKey;

        if (meta) {
            sendCommand('KEY_PRESS', { keyCode: 91 });
            return;
        }

        sendCommand('KEY_PRESS', { keyCode: keyCode, ctrl: ctrl, alt: alt, shift: shift });
    });

    document.addEventListener('keyup', (e) => {
        if (!controlMode) return;
        e.preventDefault();
        e.stopPropagation();

        let keyCode = e.keyCode;
        const specialKeys = {
            'Delete': 46, 'Insert': 45, 'Home': 36, 'End': 35,
            'PageUp': 33, 'PageDown': 34, 'ArrowUp': 38, 'ArrowDown': 40,
            'ArrowLeft': 37, 'ArrowRight': 39
        };
        if (specialKeys[e.key]) keyCode = specialKeys[e.key];

        sendCommand('KEY_RELEASE', { keyCode: keyCode });
    });

    canvas.addEventListener('contextmenu', (e) => {
        if (!controlMode) return;
        e.preventDefault();
        sendCommand('MOUSE_CLICK', { button: 3 });
        return false;
    });

    // UI Controls
    document.getElementById('controlModeBtn').onclick = toggleControlMode;
    document.getElementById('settingsBtn').onclick = () => {
        const p = document.getElementById('settingsPanel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    };
    document.getElementById('applySettingsBtn').onclick = () => {
        applySettings();
        document.getElementById('settingsPanel').style.display = 'none';
    };
    document.getElementById('fullscreenBtn').onclick = () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    };
    document.getElementById('disconnectBtn').onclick = () => {
        if (ws) ws.close();
        window.location.href = '/pcs.html';
    };

    // Initialize
    getRemoteScreenSize();
    const s = getSize('720');
    canvas.width = s.w;
    canvas.height = s.h;
    connect();
</script>
</body>
</html>
