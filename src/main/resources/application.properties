# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/remote_pc_db
spring.datasource.username=remote_user
spring.datasource.password=remote_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=mySuperSecretKeyForJWT1234567890123456789012345678901234567890
jwt.expiration.ms=86400000

# Server
server.port=8080